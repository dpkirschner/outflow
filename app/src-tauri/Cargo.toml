[package]
name = "outflow-tauri"
version = "0.1.0"
edition = "2021"
description = "outflow desktop GUI"

[[bin]]
name = "outflow-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
outflow-core = { path = "../../core" }
outflow-net = { path = "../../net", optional = true }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Desktop build wants network + keychain by default; encryption is opt-in
# (heavier SQLCipher build, and gracefully falls back to plaintext when unset).
default = ["net", "keychain"]
net = ["dep:outflow-net"]
keychain = ["net", "outflow-net/keychain"]
encryption = ["outflow-core/encryption"]
