[package]
name = "outflow-tauri"
version = "0.1.0"
edition = "2021"
description = "outflow desktop GUI"

[[bin]]
name = "outflow-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
outflow-core = { path = "../../core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
