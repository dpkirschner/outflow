[package]
name = "outflow-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "outflow"
path = "src/main.rs"

[dependencies]
outflow-core = { path = "../core" }
outflow-net = { path = "../net", optional = true }
clap = { version = "=4.4.18", features = ["derive", "env"] }
# JSON output (--json) for agent consumption; no network implied.
serde = "1"
serde_json = "1"
ureq = { version = "2", optional = true }

[features]
default = []
net = ["dep:outflow-net"]
# HTTP client mode against a running outflow-server (--server URL). Lighter
# than `net`: no Plaid/LLM code, just the API calls.
client = ["dep:ureq"]
encryption = ["outflow-core/encryption"]
