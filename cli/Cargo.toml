[package]
name = "outflow-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "outflow"
path = "src/main.rs"

[dependencies]
outflow-core = { path = "../core" }
clap = { version = "=4.4.18", features = ["derive", "env"] }
serde_json = "1"
ureq = { version = "2", optional = true }
keyring = { version = "2", optional = true }

[features]
default = []
net = ["dep:ureq"]
keychain = ["dep:keyring"]
encryption = ["outflow-core/encryption"]
