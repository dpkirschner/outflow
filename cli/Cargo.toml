[package]
name = "outflow-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "outflow"
path = "src/main.rs"

[dependencies]
outflow-core = { path = "../core" }
outflow-net = { path = "../net", optional = true }
clap = { version = "=4.4.18", features = ["derive", "env"] }

[features]
default = []
net = ["dep:outflow-net"]
keychain = ["net", "outflow-net/keychain"]
encryption = ["outflow-core/encryption"]
