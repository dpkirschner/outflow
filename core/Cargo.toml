[package]
name = "outflow-core"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure computation (no network) — used only to bucket months in the machine's
# local timezone, which raw epoch math cannot do DST-correctly. Keeps invariant
# #3 (no network/GUI in core) intact.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
# Pure codegen (no network): derives the TS mirrors in app/src/types.ts.
# Off by default; the server's types test turns it on.
ts-rs = { version = "12.0.1", optional = true, default-features = false, features = ["serde-compat"] }


[features]
encryption = ["rusqlite/bundled-sqlcipher-vendored-openssl"]
ts = ["dep:ts-rs"]
