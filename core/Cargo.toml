[package]
name = "outflow-core"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure computation (no network) — used only to bucket months in the machine's
# local timezone, which raw epoch math cannot do DST-correctly. Keeps invariant
# #3 (no network/GUI in core) intact.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }


[features]
encryption = ["rusqlite/bundled-sqlcipher-vendored-openssl"]
