# Amex Offers available to add on the card ending 1006, captured 2026-10-17.
#
# One line per offer. Exactly one reward key per offer:
#   back           = "20.00"  fixed statement credit (decimal string, parsed
#                             via Money::from_decimal_str — never floats)
#   pct            = 10       percent back
#   pts            = 1500     flat Membership Rewards points
#   pts_per_dollar = 5        extra MR points per dollar
#
# Optional keys:
#   min      = "80.00"   minimum spend per qualifying purchase
#   uses     = 1         times the offer can trigger (absent = until max is hit)
#   max      = "20.00"   total cash cap; max_pts = total points cap
#   single   = true      must be a single purchase
#   per_year = true      the cap resets yearly instead of once per offer
#   added    = true      the offer has been added (enrolled) on the card. Absent = false:
#                        it's only available, and charges don't earn it yet.
#                        At capture time none of these offers were added.
#   note     = "..."     terms the matcher can't check (location, new members only, ...)
#   match    = [...]     DRAFT normalized-payee patterns (see subscriptions::normalize_payee:
#                        lowercase alphanumeric tokens joined by spaces). Not yet verified
#                        against real bank descriptors.

[card]
issuer = "American Express"
mask = "1006"   # matches the " (1006)" suffix plaid.rs bakes onto the account name
captured = 2026-10-17

