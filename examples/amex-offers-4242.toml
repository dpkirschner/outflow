# Sample card offers for a card ending 4242. Merchants and terms are invented.
#
# One line per offer. Exactly one reward key per offer:
#   back           = "20.00"  fixed statement credit (decimal string, parsed
#                             via Money::from_decimal_str — never floats)
#   pct            = 10       percent back
#   pts            = 1500     flat Membership Rewards points
#   pts_per_dollar = 5        extra MR points per dollar
#
# Optional keys:
#   min      = "80.00"   minimum spend per qualifying purchase
#   uses     = 1         times the offer can trigger (absent = until max is hit)
#   max      = "20.00"   total cash cap; max_pts = total points cap
#   single   = true      must be a single purchase
#   per_year = true      the cap resets yearly instead of once per offer
#   added    = true      the offer has been added (enrolled) on the card. Absent = false:
#                        it's only available, and charges don't earn it yet.
#                        None of these sample offers are added.
#   note     = "..."     terms the matcher can't check (location, new members only, ...)
#   match    = [...]     normalized-payee patterns (see subscriptions::normalize_payee:
#                        lowercase alphanumeric tokens joined by spaces).

[card]
issuer = "American Express"
mask = "4242"   # matches the " (4242)" suffix plaid.rs bakes onto the account name
captured = 2026-10-01

offers = [
  { merchant = "Streamly", back = "30.00", min = "65.00", uses = 3, max = "90.00", expires = 2026-11-07, match = ["streamly"] },
  { merchant = "Northwind Outfitters", back = "20.00", min = "100.00", uses = 1, max = "20.00", expires = 2026-10-22, match = ["northwind outfitters", "northwind"] },
  { merchant = "Bluefin Sushi Bar", back = "10.00", min = "40.00", uses = 1, max = "10.00", expires = 2026-10-25, match = ["bluefin sushi"] },
  { merchant = "Pixel Arcade – gift cards", back = "15.00", min = "60.00", uses = 1, max = "15.00", expires = 2026-10-31, match = ["pixel arcade"], note = "gift cards only" },
  { merchant = "Copperleaf Coffee", back = "3.00", min = "3.00", uses = 1, max = "3.00", expires = 2026-10-23, match = ["copperleaf"] },
  { merchant = "Greenbasket Grocers", pct = 5, single = true, uses = 1, max = "4.00", expires = 2026-10-25, match = ["greenbasket"] },
  { merchant = "Trampoline Town", pct = 25, max = "15.00", expires = 2026-10-30, match = ["trampoline town"] },
  { merchant = "Brightway Fuel (pump & app)", back = "5.00", min = "30.00", uses = 1, max = "5.00", expires = 2026-10-31, match = ["brightway"], note = "pump & app" },
  { merchant = "Corner Pharmacy", pct = 10, max = "5.00", expires = 2026-10-31, match = ["corner pharmacy"] },
  { merchant = "Hearth & Home", pct = 7, max = "27.00", expires = 2026-10-31, match = ["hearth home"] },
  { merchant = "Lumen Cosmetics", pct = 8, max = "250.00", expires = 2026-11-02, match = ["lumen cosmetics"] },
  { merchant = "Fernwood Skincare", pct = 5, max = "250.00", expires = 2026-11-02, match = ["fernwood"] },
  { merchant = "Tidewater Swim", pct = 15, single = true, uses = 1, max = "30.00", expires = 2026-11-05, match = ["tidewater"] },
  { merchant = "Cloudnine Storage", pct = 40, max = "30.00", expires = 2026-12-31, match = ["cloudnine"] },
  { merchant = "Atlas Rail – tickets", back = "25.00", min = "150.00", uses = 1, max = "25.00", expires = 2026-11-10, match = ["atlas rail"], note = "online booking only" },
  { merchant = "Kestrel Books", pts = 1500, min = "30.00", uses = 1, max_pts = 1500, expires = 2026-11-14, match = ["kestrel books"], note = "online only, not in-store" },
  { merchant = "Marigold Market", pts = 500, min = "50.00", uses = 3, max_pts = 1500, expires = 2026-12-05, match = ["marigold market", "marigold mkt"] },
  { merchant = "Harbor & Pine", pts = 4000, min = "250.00", uses = 1, max_pts = 4000, expires = 2026-12-24, match = ["harbor pine"] },
  { merchant = "Velocity Sportswear", pts_per_dollar = 6, max_pts = 5000, expires = 2026-12-31, match = ["velocity sportswear"] },
  { merchant = "Juniper Boutique", pts_per_dollar = 5, max_pts = 5000, expires = 2026-11-14, match = ["juniper boutique"] },
  { merchant = "Fanfare Tickets", pts_per_dollar = 5, max_pts = 15000, expires = 2027-01-01, match = ["fanfare"] },
  { merchant = "Orbit Mobile", back = "10.00", min = "50.00", uses = 1, max = "10.00", expires = 2026-12-15, match = ["orbit mobile"], note = "new customers only" },
  { merchant = "Riverside Cinemas", pct = 20, uses = 2, max = "12.00", expires = 2026-11-30, match = ["riverside cinemas"] },
  { merchant = "Stadium Collection (concessions)", pct = 10, max = "250.00", per_year = true, expires = 2026-12-31, match = [], note = "concessions at partner stadiums; no single merchant descriptor" },
]
