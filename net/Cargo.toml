description = "Networked adapters for outflow (SimpleFIN, secrets, Anthropic)"

[dependencies]
outflow-core = { path = "../core" }
ureq = "2"
serde_json = "1"
keyring = { version = "2", optional = true }

[features]
keychain = ["dep:keyring"]
